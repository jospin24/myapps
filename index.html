<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Field HQ — Job Hunt & Goals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-2:#212B39;
    --paper:#F7F4EC;
    --paper-dim:#EDE9DD;
    --amber:#E8A33D;
    --teal:#4C8577;
    --coral:#D9695F;
    --slate:#8B97A6;
    --line: rgba(247,244,236,0.12);
    --line-strong: rgba(247,244,236,0.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:36px 28px 80px;}

  /* ---------- HEADER ---------- */
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px;flex-wrap:wrap;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0 0 8px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:40px;margin:0;letter-spacing:-0.01em;}
  .sub{color:var(--slate);font-size:14px;margin-top:6px;max-width:480px;}
  .today{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--slate);text-align:right;}
  .today b{color:var(--paper);display:block;font-size:14px;margin-bottom:2px;}

  /* ---------- STATS STRIP ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    margin-bottom:44px;
  }
  .stat{background:var(--ink-2);padding:20px 22px;}
  .stat .num{font-family:'Fraunces',serif;font-size:32px;font-weight:600;}
  .stat .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin-top:4px;}
  .stat.amber .num{color:var(--amber);}
  .stat.teal .num{color:var(--teal);}
  .stat.coral .num{color:var(--coral);}

  /* ---------- SECTION HEADINGS ---------- */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .section-head h2{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin:0;}
  .section-head .count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--slate);}
  section{margin-bottom:56px;}

  /* ---------- TRAIL (signature element) ---------- */
  .trail{position:relative;margin:0 0 18px;height:34px;}
  .trail svg{width:100%;height:100%;display:block;}
  .trail-labels{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:6px;}
  .trail-labels span{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);}
  .trail-labels span.active{color:var(--paper);}

  /* ---------- KANBAN ---------- */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .col{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:120px;}
  .col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px;}
  .col-head h3{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--paper);}
  .col-head .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--slate);}
  .card{
    background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 13px;margin-bottom:10px;
    box-shadow:0 1px 0 rgba(0,0,0,0.2);cursor:default;
  }
  .card .company{font-family:'Fraunces',serif;font-weight:600;font-size:15px;line-height:1.2;}
  .card .role{font-size:12.5px;color:#5A5348;margin-top:2px;}
  .card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:8px;}
  .card .date{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#8a8375;}
  .card .del{border:none;background:none;color:#B7AFA0;cursor:pointer;font-size:13px;line-height:1;padding:2px 4px;}
  .card .del:hover{color:var(--coral);}
  .card .stage-select{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;border:1px solid #DDD6C4;background:#EFEBDD;
    color:#4A4436;border-radius:6px;padding:4px 6px;cursor:pointer;
  }
  .empty-col{font-size:12px;color:var(--slate);padding:8px 4px;font-style:italic;}

  .add-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .add-row input, .add-row select{
    font-family:'Inter',sans-serif;font-size:13px;background:var(--ink-2);border:1px solid var(--line-strong);
    color:var(--paper);border-radius:8px;padding:9px 11px;
  }
  .add-row input::placeholder{color:var(--slate);}
  .add-row input{flex:1;min-width:140px;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;border:none;border-radius:8px;
    padding:9px 16px;cursor:pointer;background:var(--amber);color:#221705;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.teal{background:var(--teal);color:#08211C;}

  /* ---------- GOALS / WAYPOINTS ---------- */
  .goals{display:flex;flex-direction:column;gap:0;}
  .goal{display:flex;gap:18px;position:relative;padding-bottom:28px;}
  .goal:last-child{padding-bottom:0;}
  .waypoint{display:flex;flex-direction:column;align-items:center;width:28px;flex-shrink:0;}
  .pin{
    width:28px;height:28px;border-radius:50%;background:var(--ink-2);border:2px solid var(--teal);
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--teal);flex-shrink:0;z-index:1;
  }
  .pin.done{background:var(--teal);color:var(--ink);}
  .wline{width:2px;flex:1;background:var(--line-strong);margin-top:4px;}
  .goal-body{flex:1;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .goal-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .goal-cat{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin-top:3px;}
  .goal-due{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--slate);white-space:nowrap;}
  .bar-track{background:rgba(255,255,255,0.08);height:7px;border-radius:5px;margin-top:12px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),#7FBFA9);border-radius:5px;}
  .goal-pct-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .goal-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal);}
  .pct-btn{
    width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);background:transparent;
    color:var(--paper);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .pct-btn:hover{border-color:var(--teal);color:var(--teal);}
  .milestones{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
  .m{
    font-size:11.5px;padding:5px 10px;border-radius:20px;border:1px solid var(--line-strong);color:var(--slate);
    display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  }
  .m.done{color:var(--paper);border-color:var(--teal);background:rgba(76,133,119,0.18);}
  .m .dot{width:6px;height:6px;border-radius:50%;background:var(--slate);}
  .m.done .dot{background:var(--teal);}

  .goal-add{background:var(--ink-2);border:1px dashed var(--line-strong);border-radius:14px;padding:16px 18px;margin-top:8px;}
  .goal-add .add-row{margin-top:12px;}
  .goal-add input[type=range]{flex:1;min-width:120px;accent-color:var(--teal);}
  .range-val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--teal);width:36px;}

  footer{margin-top:40px;color:var(--slate);font-size:11.5px;font-family:'JetBrains Mono',monospace;text-align:center;}

  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .board{grid-template-columns:repeat(2,1fr);}
    .trail-labels{grid-template-columns:repeat(2,1fr);}
  }
  @media(max-width:560px){
    .board{grid-template-columns:1fr;}
    .trail-labels{grid-template-columns:repeat(2,1fr);}
    header{flex-direction:column;align-items:flex-start;}
    .today{text-align:left;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">Field HQ</p>
      <h1>The Hunt & The Plan</h1>
      <p class="sub">One map for who you've applied to and where you're headed. Nothing here saves after you close the tab — it's yours to try, edit, and reshape.</p>
    </div>
    <div class="today"><b id="todayStr"></b>local time</div>
  </header>

  <div class="stats" id="statsRow"></div>

  <section>
    <div class="section-head">
      <h2>Application trail</h2>
      <span class="count" id="jobCount"></span>
    </div>

    <div class="trail-labels" id="trailLabels"></div>
    <div class="trail"><svg id="trailSvg" viewBox="0 0 1000 34" preserveAspectRatio="none"></svg></div>

    <div class="board" id="board"></div>

    <div class="add-row">
      <input id="newCompany" placeholder="Company (e.g. Northwind Labs)" />
      <input id="newRole" placeholder="Role (e.g. Product Designer)" />
      <select id="newStage">
        <option>Wishlist</option>
        <option>Applied</option>
        <option>Interviewing</option>
        <option>Offer</option>
      </select>
      <button class="btn" onclick="addJob()">Add application</button>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Goals in motion</h2>
      <span class="count" id="goalCount"></span>
    </div>

    <div class="goals" id="goalsList"></div>

    <div class="goal-add">
      <input id="newGoalTitle" placeholder="New goal (e.g. Ship portfolio site)" style="width:100%;font-family:'Inter',sans-serif;font-size:13px;background:var(--ink);border:1px solid var(--line-strong);color:var(--paper);border-radius:8px;padding:9px 11px;" />
      <div class="add-row">
        <input id="newGoalCat" placeholder="Category (e.g. Career)" style="max-width:160px;" />
        <input id="newGoalDue" placeholder="Due (e.g. Sep 30)" style="max-width:120px;" />
        <input type="range" id="newGoalPct" min="0" max="100" value="10" oninput="document.getElementById('rangeVal').textContent=this.value+'%'">
        <span class="range-val" id="rangeVal">10%</span>
        <button class="btn teal" onclick="addGoal()">Add goal</button>
      </div>
    </div>
  </section>

  <footer>FIELD HQ — sample data, in-memory only, refresh to reset</footer>
</div>

<script>
const STAGES = ["Wishlist","Applied","Interviewing","Offer"];
const stageColor = { Wishlist:"#8B97A6", Applied:"#E8A33D", Interviewing:"#D9695F", Offer:"#4C8577" };

let jobs = [
  {company:"Northwind Labs", role:"Senior Product Designer", stage:"Interviewing", date:"Aug 2"},
  {company:"Hearth & Co.", role:"UX Researcher", stage:"Applied", date:"Aug 4"},
  {company:"Lumen Analytics", role:"Product Designer", stage:"Applied", date:"Jul 30"},
  {company:"Basecamp Foods", role:"Design Lead", stage:"Wishlist", date:"—"},
  {company:"Tideline Studio", role:"Product Designer", stage:"Offer", date:"Jul 22"},
  {company:"Argon Systems", role:"UX Designer", stage:"Wishlist", date:"—"},
  {company:"Fernwood Health", role:"Senior Designer", stage:"Interviewing", date:"Aug 5"},
];

let goals = [
  {title:"Land a new role by October", cat:"Career", due:"Oct 1", pct:55,
    milestones:[{t:"Resume rewritten",done:true},{t:"10 applications sent",done:true},{t:"3 first-round interviews",done:false},{t:"Offer in hand",done:false}]},
  {title:"Rebuild portfolio site", cat:"Career", due:"Aug 20", pct:70,
    milestones:[{t:"Pick 4 case studies",done:true},{t:"Write case study copy",done:true},{t:"Ship live site",done:false}]},
  {title:"Save a 3-month runway", cat:"Finance", due:"Nov 1", pct:40,
    milestones:[{t:"Set monthly target",done:true},{t:"Automate transfer",done:true},{t:"Hit halfway mark",done:false}]},
];

function fmtToday(){
  const d = new Date();
  document.getElementById('todayStr').textContent = d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
}

function renderStats(){
  const active = jobs.filter(j=>j.stage==="Applied"||j.stage==="Interviewing").length;
  const interviewing = jobs.filter(j=>j.stage==="Interviewing").length;
  const offers = jobs.filter(j=>j.stage==="Offer").length;
  const respRate = jobs.filter(j=>j.stage!=="Wishlist").length
    ? Math.round((jobs.filter(j=>j.stage==="Interviewing"||j.stage==="Offer").length / jobs.filter(j=>j.stage!=="Wishlist").length)*100)
    : 0;
  const avgGoal = goals.length ? Math.round(goals.reduce((a,g)=>a+g.pct,0)/goals.length) : 0;

  const stats = [
    {n: active, l:"Active applications", cls:"amber"},
    {n: interviewing, l:"In interview stage", cls:"coral"},
    {n: respRate+"%", l:"Response rate", cls:""},
    {n: avgGoal+"%", l:"Avg. goal progress", cls:"teal"},
  ];
  document.getElementById('statsRow').innerHTML = stats.map(s=>`
    <div class="stat ${s.cls}"><div class="num">${s.n}</div><div class="lbl">${s.l}</div></div>
  `).join('');
}

function renderTrail(){
  const counts = STAGES.map(s=>jobs.filter(j=>j.stage===s).length);
  const max = Math.max(...counts,1);
  document.getElementById('trailLabels').innerHTML = STAGES.map((s,i)=>
    `<span class="${counts[i]>0?'active':''}">${s} · ${counts[i]}</span>`).join('');

  const w=1000,h=34, n=STAGES.length;
  const xs = STAGES.map((_,i)=> (w/(n))*(i+0.5));
  let path = `M ${xs[0]} 17 `;
  for(let i=1;i<xs.length;i++){ path += `L ${xs[i]} 17 `; }
  let svg = `<path d="${path}" stroke="var(--line-strong)" stroke-width="2" fill="none" stroke-dasharray="2 8" stroke-linecap="round"/>`;
  xs.forEach((x,i)=>{
    const r = 6 + Math.min(counts[i],6)*1.6;
    svg += `<circle cx="${x}" cy="17" r="${r}" fill="${stageColor[STAGES[i]]}" opacity="0.9"/>`;
    svg += `<circle cx="${x}" cy="17" r="3" fill="var(--ink)"/>`;
  });
  document.getElementById('trailSvg').innerHTML = svg;
}

function renderBoard(){
  document.getElementById('jobCount').textContent = jobs.length + " total";
  document.getElementById('board').innerHTML = STAGES.map(stage=>{
    const items = jobs.map((j,idx)=>({...j,idx})).filter(j=>j.stage===stage);
    return `
      <div class="col">
        <div class="col-head">
          <h3 style="color:${stageColor[stage]}">${stage}</h3>
          <span class="n">${items.length}</span>
        </div>
        ${items.length? items.map(j=>`
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <div class="company">${j.company}</div>
                <div class="role">${j.role}</div>
              </div>
              <button class="del" onclick="removeJob(${j.idx})">✕</button>
            </div>
            <div class="meta">
              <span class="date">${j.date}</span>
              <select class="stage-select" onchange="moveJob(${j.idx}, this.value)">
                ${STAGES.map(s=>`<option value="${s}" ${s===j.stage?'selected':''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>
        `).join('') : `<div class="empty-col">Nothing here yet</div>`}
      </div>
    `;
  }).join('');
}

function renderGoals(){
  document.getElementById('goalCount').textContent = goals.length + " tracked";
  document.getElementById('goalsList').innerHTML = goals.map((g,gi)=>{
    const isLast = gi===goals.length-1;
    return `
    <div class="goal">
      <div class="waypoint">
        <div class="pin ${g.pct>=100?'done':''}">${gi+1}</div>
        ${isLast? '' : '<div class="wline"></div>'}
      </div>
      <div class="goal-body">
        <div class="goal-top">
          <div>
            <div class="goal-title">${g.title}</div>
            <div class="goal-cat">${g.cat}</div>
          </div>
          <div class="goal-due">Due ${g.due}</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${g.pct}%"></div></div>
        <div class="goal-pct-row">
          <button class="pct-btn" onclick="adjustGoalPct(${gi},-5)">−</button>
          <span class="goal-pct">${g.pct}% complete</span>
          <button class="pct-btn" onclick="adjustGoalPct(${gi},5)">+</button>
        </div>
        <div class="milestones">
          ${g.milestones.map((m,mi)=>`
            <div class="m ${m.done?'done':''}" onclick="toggleMilestone(${gi},${mi})">
              <span class="dot"></span>${m.t}
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderAll(){ renderStats(); renderTrail(); renderBoard(); renderGoals(); }

function addJob(){
  const company = document.getElementById('newCompany').value.trim();
  const role = document.getElementById('newRole').value.trim();
  const stage = document.getElementById('newStage').value;
  if(!company){ return; }
  const today = new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'});
  jobs.push({company, role: role||"—", stage, date: today});
  document.getElementById('newCompany').value='';
  document.getElementById('newRole').value='';
  renderAll();
}
function removeJob(idx){ jobs.splice(idx,1); renderAll(); }
function moveJob(idx,newStage){ jobs[idx].stage = newStage; renderAll(); }

function adjustGoalPct(gi,delta){
  goals[gi].pct = Math.max(0, Math.min(100, goals[gi].pct + delta));
  renderAll();
}

function addGoal(){
  const title = document.getElementById('newGoalTitle').value.trim();
  const cat = document.getElementById('newGoalCat').value.trim() || "General";
  const due = document.getElementById('newGoalDue').value.trim() || "No date";
  const pct = parseInt(document.getElementById('newGoalPct').value,10);
  if(!title){ return; }
  goals.push({title, cat, due, pct, milestones:[]});
  document.getElementById('newGoalTitle').value='';
  document.getElementById('newGoalCat').value='';
  document.getElementById('newGoalDue').value='';
  document.getElementById('newGoalPct').value=10;
  document.getElementById('rangeVal').textContent='10%';
  renderAll();
}
function toggleMilestone(gi,mi){
  goals[gi].milestones[mi].done = !goals[gi].milestones[mi].done;
  renderAll();
}

fmtToday();
renderAll();
</script>
</body>
</html>
